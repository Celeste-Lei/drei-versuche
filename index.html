<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DREI VERSUCHE · 三次机会 — 德国留学之路</title>
<style>
:root{
  --ink:#1D2B23;
  --panel:#2A3B33;
  --panel-2:#22302A;
  --line:#101815;
  --cream:#F4EFD9;
  --cream-2:#E4DCBE;
  --teal:#4E9A92;
  --teal-2:#79C4BC;
  --red:#C0503E;
  --gold:#E8B84B;
  --mono:"Courier New",Consolas,"SF Mono",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;background:#17211B;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  color:var(--cream);font-family:var(--sans);
  display:flex;justify-content:center;
  padding:26px 14px 60px;
}
#app{width:100%;max-width:940px}

/* ================= HUD ================= */
#hud{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;
  font-family:var(--mono);
}
.chip{
  background:var(--panel-2);border:3px solid var(--line);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.09), inset -2px -2px 0 rgba(0,0,0,.28);
  padding:5px 10px 4px;display:flex;align-items:center;gap:7px;
  font-size:12px;letter-spacing:.06em;color:var(--cream-2);
}
.chip svg{width:14px;height:14px;display:block}
.chip b{color:var(--cream);font-weight:700}
.chip.hot b{color:var(--gold)}
.attdots{letter-spacing:2px;color:var(--red);font-size:13px}

/* ================= 舞台 ================= */
#stage{
  position:relative;aspect-ratio:16/9;width:100%;
  border:4px solid var(--line);
  box-shadow:0 0 0 3px #3A5045, 0 18px 40px -18px rgba(0,0,0,.8);
  overflow:hidden;background:#CDE8D8;cursor:pointer;
}
#bg{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none}
#fx.night{background:rgba(18,28,44,.34)}
#fx.rain{
  background-image:repeating-linear-gradient(76deg, transparent 0 13px, rgba(214,232,240,.30) 13px 14px, transparent 14px 27px);
  background-size:27px 27px;animation:rainmove .48s linear infinite;
}
@keyframes rainmove{to{background-position:-27px 27px}}
#fx.flash::before{content:"";position:absolute;inset:0;background:transparent;animation:lightning 7s infinite}
@keyframes lightning{0%,93%,100%{background:transparent}94%{background:rgba(240,248,255,.22)}95%{background:transparent}96%{background:rgba(240,248,255,.15)}}

/* 章节标签 */
#chlabel{
  position:absolute;top:10px;left:10px;z-index:6;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  background:var(--line);color:var(--gold);padding:4px 9px 3px;
  box-shadow:2px 2px 0 rgba(0,0,0,.35);
}

/* 转场 */
#transit{
  position:absolute;inset:0;z-index:9;display:none;
  background:linear-gradient(#1A2620,#24352C 55%,#2C4237);
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
#transit.on{display:flex}
#transit .roadstripes{
  position:absolute;left:0;right:0;bottom:0;height:56%;
  background:linear-gradient(transparent, rgba(140,144,138,.16) 40%, #84888280 100%);
}
#transit .roadstripes::before{
  content:"";position:absolute;left:46%;right:46%;top:0;bottom:0;
  background:repeating-linear-gradient(180deg, var(--cream-2) 0 18px, transparent 18px 34px);
  animation:stripes 0.42s linear infinite;opacity:.85;
}
@keyframes stripes{to{background-position:0 34px}}
#transit .tlabel{
  position:relative;font-family:var(--mono);font-size:15px;letter-spacing:.22em;
  color:var(--cream);background:var(--line);padding:8px 18px 7px;
  box-shadow:4px 4px 0 rgba(0,0,0,.4);
  animation:tIn .5s cubic-bezier(.2,.9,.3,1.4) both;
}
#transit .tsub{position:relative;font-size:11px;color:var(--teal-2);letter-spacing:.3em;background:rgba(26,38,32,.88);padding:3px 10px 2px}
@keyframes tIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}

/* 收卡提示 */
#toast{
  position:absolute;top:12px;right:12px;z-index:8;max-width:70%;
  background:var(--line);border:2px solid var(--gold);
  color:var(--cream);padding:8px 12px 7px;font-size:12px;line-height:1.6;
  box-shadow:3px 3px 0 rgba(0,0,0,.4);
  display:none;animation:tIn .4s both;
}
#toast b{color:var(--gold)}
#toast.on{display:block}
#toast .tt{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--teal-2);display:block;margin-bottom:2px}

/* ================= 对话区 ================= */
#dlg{
  margin-top:12px;background:var(--panel);border:4px solid var(--line);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.07), inset -2px -2px 0 rgba(0,0,0,.3), 0 0 0 3px #3A5045;
  min-height:132px;display:flex;gap:12px;padding:12px;position:relative;
}
#portbox{
  flex:0 0 78px;width:78px;height:78px;align-self:flex-start;
  background:var(--panel-2);border:3px solid var(--line);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#portbox svg{width:68px;height:68px;display:block}
#dsay{flex:1;min-width:0;display:flex;flex-direction:column}
#who{
  display:none;align-self:flex-start;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  color:var(--line);background:var(--teal-2);
  padding:3px 9px 2px;margin-bottom:8px;
}
#who.on{display:inline-block}
#who.mail{background:var(--gold)}
#who.book{background:var(--cream-2)}
#who.red{background:var(--red);color:var(--cream)}
#text{
  font-size:15px;line-height:1.9;color:var(--cream);
  min-height:56px;letter-spacing:.01em;overflow-wrap:break-word;
}
#text .de{font-family:var(--mono);font-size:.92em;color:var(--teal-2)}
#text em{font-style:normal;color:var(--gold)}
#text b{font-weight:700;color:#FFF}
#cont{
  position:absolute;right:14px;bottom:8px;font-family:var(--mono);
  color:var(--teal-2);font-size:12px;display:none;animation:bob 1s infinite;
}
#cont.on{display:block}
@keyframes bob{50%{transform:translateY(3px)}}

/* 选项 */
#choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pxopt{
  text-align:left;cursor:pointer;font-family:var(--sans);
  background:var(--cream);color:var(--ink);
  border:3px solid var(--line);
  box-shadow:inset 2px 2px 0 #FFF, inset -2px -2px 0 rgba(0,0,0,.14), 2px 2px 0 rgba(0,0,0,.35);
  padding:9px 12px 8px;transition:transform .12s, background .12s;
}
.pxopt:hover:not(:disabled){transform:translate(-1px,-1px);background:#FFFDEE}
.pxopt:active:not(:disabled){transform:translate(1px,1px)}
.pxopt:disabled{opacity:.45;cursor:default}
.pxopt .ol{display:block;font-size:14.5px;font-weight:700;line-height:1.5}
.pxopt .os{display:block;font-family:var(--mono);font-size:10.5px;color:#5B6B5E;margin-top:3px;letter-spacing:.02em}
.pxopt.primary{background:var(--teal)}
.pxopt.primary .ol{color:#FFF}
.pxopt.primary .os{color:#D2ECE8}
.pxopt.primary:hover:not(:disabled){background:var(--teal-2)}
.pxopt.picked{background:var(--gold)}
.pxopt.picked .ol{color:var(--ink)}

/* ================= 面板（舞台上弹窗） ================= */
#panelwrap{
  position:absolute;inset:0;z-index:7;display:none;
  background:rgba(16,24,20,.62);padding:4%;
  align-items:center;justify-content:center;
}
#panelwrap.on{display:flex}
#panel{
  width:100%;max-height:100%;overflow:auto;
  background:var(--panel-2);border:3px solid var(--line);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.08), 0 14px 30px rgba(0,0,0,.5);
  padding:16px 18px 14px;color:var(--cream);
  animation:tIn .35s both;
}
#panel::-webkit-scrollbar{width:10px}
#panel::-webkit-scrollbar-thumb{background:var(--teal);border:2px solid var(--line)}

/* 文档流面板 */
#flowbox{
  margin-top:12px;background:var(--panel-2);border:3px solid var(--line);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.08), 0 0 0 3px #3A5045;
  padding:18px 20px 16px;color:var(--cream);
}
#flowbox h3{
  font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--teal-2);
  border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:12px;font-weight:400;
}
#flowbox h3 span{color:var(--gold)}
#flowbox p{font-size:13.5px;line-height:1.85;margin-bottom:10px}
#flowbox b{color:var(--gold)}
#flowbox em{font-style:normal;color:var(--teal-2)}
#flowbox .src{display:block;font-family:var(--mono);font-size:9.5px;color:#7E938A;letter-spacing:.04em;margin-top:6px}
#panel h3{
  font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--teal-2);
  border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:12px;font-weight:400;
}
#panel h3 span{color:var(--gold)}
#panel p{font-size:13.5px;line-height:1.85;margin-bottom:10px}
#panel b{color:var(--gold)}
#panel em{font-style:normal;color:var(--teal-2)}
#panel .src{display:block;font-family:var(--mono);font-size:9.5px;color:#7E938A;letter-spacing:.04em;margin-top:6px}

/* 深色系统屏（DSH / 论文封面） */
.sysrow{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11.5px;line-height:2;color:#AFC5BC;border-bottom:1px dashed rgba(232,237,233,.1)}
.sysrow b{color:#EFF4EF;font-weight:400;flex-shrink:0}
.sysrow em{color:#FFC99B;font-style:normal}
.syswarn{margin-top:11px;font-size:11px;line-height:1.8;color:#E9BA8D}
.sysbig{font-family:var(--mono);font-size:15px;color:#F4F7F4;margin:2px 0 10px;letter-spacing:.04em}

/* 条款卡 */
#clgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:8px}
.clause{
  background:var(--cream);color:var(--ink);border:3px solid var(--line);
  box-shadow:2px 2px 0 rgba(0,0,0,.35);padding:9px 11px 8px;
  cursor:pointer;position:relative;transition:transform .12s;
}
.clause:hover{transform:translate(-1px,-1px)}
.clause .de{font-family:var(--mono);font-size:10.5px;line-height:1.6;color:#2E3A32}
.clause .cn{font-size:10.5px;line-height:1.6;color:#5B6B5E;margin-top:5px;border-top:1px dashed #C9C2A4;padding-top:5px}
.clause.marked{background:#FBE9A8}
.clause.marked::after{
  content:"✓";position:absolute;right:7px;top:4px;color:var(--red);font-family:var(--mono);font-weight:700;font-size:13px;
}
.clause.wrongpick{background:#E8B4A8}
.clause .tip{display:none;margin-top:7px;padding:6px 9px;background:rgba(192,80,62,.12);border-left:3px solid var(--red);font-size:10.5px;line-height:1.6;color:#7A4036}
.clause.wrongpick .tip{display:block}

/* 求租 */
.pinglog{
  height:96px;overflow:hidden;font-family:var(--mono);font-size:10.5px;line-height:1.85;
  color:#8FA6A0;border-left:2px solid var(--line);padding-left:11px;margin-bottom:10px;
}
.pinglog div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinglog div:last-child{color:var(--cream)}
.pinglog .hit{color:var(--red);font-weight:700}

/* 论文登记表 */
.formfield{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--cream);color:var(--ink);border:3px solid var(--line);
  box-shadow:2px 2px 0 rgba(0,0,0,.3);padding:9px 12px 8px;margin-bottom:8px;cursor:pointer;
}
.formfield .fk{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#5B6B5E;flex:0 0 118px;padding-top:2px;text-transform:uppercase}
.formfield .fv{font-family:var(--mono);font-size:12px;line-height:1.6;color:#26301F;flex:1;min-width:0;overflow-wrap:anywhere}
.formfield.wrongpick{background:#E8B4A8}
.formfield.rightpick{background:#B9D8A8}

/* 量表 */
.gaugebar{height:14px;background:#141D18;border:2px solid var(--line);position:relative;overflow:hidden;margin:6px 0 8px}
.gaugebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-2));transition:width .9s ease}
.gaugebar .th{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--red)}
.gaugebar .th2{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--gold)}
.gaugenote{font-size:10.5px;color:#8FA6A0;line-height:1.7}

/* 印章 */
.pstamp{
  display:inline-block;margin:2px 0 12px;
  border:4px double var(--red);color:var(--red);
  font-family:var(--mono);font-size:13px;letter-spacing:.14em;font-weight:700;
  padding:5px 12px 4px;transform:rotate(-6deg);
  animation:stampIn .5s .25s cubic-bezier(.2,.9,.3,1.25) both;
}
@keyframes stampIn{from{opacity:0;transform:rotate(-6deg) scale(1.6)}60%{opacity:1;transform:rotate(-6deg) scale(.96)}to{opacity:1;transform:rotate(-6deg) scale(1)}}

/* 台账 */
.ledger{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;margin:8px 0 12px}
.ledger td{padding:6px 0;border-bottom:1px dashed rgba(232,237,233,.15);color:#AFC5BC}
.ledger td:last-child{text-align:right;color:var(--cream);font-weight:700}

/* 知识卡收集 */
.cardlist{display:flex;flex-direction:column;gap:7px;margin:10px 0 4px}
.kcard{
  background:var(--cream);color:var(--ink);border:3px solid var(--line);
  box-shadow:2px 2px 0 rgba(0,0,0,.3);padding:9px 12px 8px;
}
.kcard .kn{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--teal);display:block;margin-bottom:3px}
.kcard .kt{font-size:13.5px;font-weight:700;display:block;margin-bottom:4px}
.kcard .kx{font-size:11.5px;line-height:1.7;color:#4A5A4E;display:block}
.kcard.miss{background:transparent;color:#5E7268;border-color:#3A4A42;box-shadow:none}
.kcard.miss .kt{color:#5E7268}

/* 结算五条 */
.findings li{font-size:12.5px;line-height:1.8;margin:0 0 9px 16px;color:#C8D6C8}
.findings li::marker{color:var(--gold)}
.findings b{color:var(--gold)}
.findings .hi{color:var(--red);font-weight:700}

details{border-top:2px solid var(--line);padding-top:10px;margin-top:12px}
summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--teal-2);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ "}

.pxbtn{
  display:inline-block;cursor:pointer;font-family:var(--mono);
  background:var(--teal);color:#FFF;border:3px solid var(--line);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.25), 2px 2px 0 rgba(0,0,0,.4);
  padding:8px 16px 7px;font-size:12px;letter-spacing:.1em;margin-top:6px;
}
.pxbtn:hover{background:var(--teal-2)}
.pxbtn.gold{background:var(--gold);color:var(--ink)}
.pxbtn.gold:hover{background:#F2CE6E}

/* ================= 开始画面 ================= */
#start{
  position:absolute;inset:0;z-index:10;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:0;
}
#start.on{display:flex}
#start .kick{
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--red);
  background:var(--cream);padding:3px 10px 2px;border:2px solid var(--line);
  margin-bottom:18px;
}
#start .bigt{
  font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:.12em;line-height:1;
  color:var(--line);text-shadow:3px 3px 0 rgba(255,255,255,.65), 6px 6px 0 rgba(90,110,95,.35);
}
#start .subt{
  font-size:21px;letter-spacing:.5em;color:#33503F;margin:10px 0 4px;font-weight:700;
}
#start .subt2{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:#4A6252;margin-bottom:26px;font-weight:700}
#start .desc{
  max-width:430px;background:rgba(244,239,217,.9);border:3px solid var(--line);
  box-shadow:3px 3px 0 rgba(0,0,0,.25);padding:10px 14px 9px;
  font-size:12.5px;line-height:1.8;color:#2E3A32;text-align:center;margin-bottom:22px;
}
#start .desc b{color:var(--red)}
#startbtn{
  cursor:pointer;font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:.28em;
  color:#FFF;background:var(--teal);border:4px solid var(--line);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.4), inset -3px -3px 0 rgba(0,0,0,.3), 4px 4px 0 rgba(0,0,0,.45);
  padding:13px 44px 11px;transition:transform .12s, background .12s;
}
#startbtn:hover{transform:translate(-2px,-2px);background:var(--teal-2)}
#startbtn:active{transform:translate(1px,1px)}
#start .hint{margin-top:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#52685A}

/* 两段式确认（可撤销） */
.pxopt.armed{
  background:var(--gold);outline:3px solid var(--red);outline-offset:-1px;
}
.pxopt.armed .ol{color:var(--ink)}
.pxopt.armed .os{color:#5B4A1E}
#armhint{
  display:none;align-items:center;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--gold);
  background:rgba(232,184,75,.08);border:2px dashed var(--gold);
  padding:6px 10px 5px;
}
#armhint.on{display:flex}
#armhint button{
  cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  background:var(--red);color:#FFF;border:2px solid var(--line);padding:3px 8px 2px;
}

/* 房间交互热点 */
#hots{position:absolute;inset:0;z-index:5;display:none}
.hs{position:absolute;border:2px dashed transparent;cursor:pointer;transition:background .15s,border-color .15s}
.hs:hover{border-color:var(--gold);background:rgba(232,184,75,.14)}
.hs.hintpulse{animation:hpulse 1.6s infinite}
@keyframes hpulse{0%,100%{border-color:transparent}50%{border-color:rgba(232,184,75,.8)}}
.hs .hst{
  position:absolute;left:0;top:-20px;white-space:nowrap;
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;
  background:var(--line);color:var(--gold);padding:2px 6px 1px;
  opacity:0;transition:opacity .15s;pointer-events:none;
}
.hs:hover .hst,.hs.used .hst{opacity:1}
.hs.used{border-color:rgba(79,154,146,.55);background:rgba(79,154,146,.08)}
.hs.used .hst{color:#7E938A}
#youover{position:absolute;z-index:4;display:none;pointer-events:none}
#youover svg{width:38px;height:auto}
#zzz{position:absolute;z-index:4;display:none;font-family:var(--mono);font-size:11px;color:var(--cream);animation:zz 2.2s infinite}
@keyframes zz{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* 转场主角（走路） */
#walker{position:absolute;bottom:23%;left:50%;transform:translateX(-50%);display:none;z-index:2}
#walker svg{width:44px;height:auto;animation:walkbob .4s infinite alternate}
@keyframes walkbob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-4px) rotate(2deg)}}

/* 危险状态 HUD */
.chip.danger{border-color:var(--red)}
.chip.danger b{color:var(--red)}

/* 心电图 */
.ecgline{stroke-dasharray:150 50;animation:ecgrun 1.8s linear infinite}
@keyframes ecgrun{to{stroke-dashoffset:-200}}

/* 思维导图 */
#mapwrap{overflow-x:auto;background:#1B2620;border:3px solid var(--line);padding:10px 8px;margin-top:12px}
#mapwrap svg{display:block;min-width:700px;width:100%;height:auto}

/* 响应式 */
@media(max-width:640px){
  body{padding:14px 8px 40px}
  #dlg{flex-direction:column;gap:9px;padding:10px}
  #portbox{flex:0 0 60px;width:60px;height:60px}
  #portbox svg{width:52px;height:52px}
  #text{font-size:13.5px;min-height:44px}
  #start .bigt{font-size:32px}
  #start .subt{font-size:16px;letter-spacing:.34em}
  .chip{font-size:10.5px;padding:4px 7px 3px}
  #panel{padding:12px 12px 10px}
  #panel p{font-size:12px}
  .formfield .fk{flex:0 0 92px}

  let o = '';

}

function roadPersp(roadC, dashC, groundC, edgeC){
  let o = `<polygon points="150,76 170,76 250,180 70,180" fill="${roadC}"/>`;
  o += `<polygon points="148,76 150,76 66,180 62,180" fill="${edgeC}"/>`;
  o += `<polygon points="170,76 172,76 258,180 254,180" fill="${edgeC}"/>`;
  let y = 170, w = 5.2, h = 9;
  while (y > 82){ o += R(160-w/2, y, w, h, dashC); y -= h + Math.max(3, h*0.55); w *= 0.80; h *= 0.80; }
  return o;
}

/* 公共地面 + 树行 */
function groundRow(groundC, treeC1, treeC2, startY){
  let o = R(0, startY, 320, 180-startY, groundC);
  for (let i = 0; i < 7; i++){
    const t = i / 6, x = 8 + t * 84, s = 2 + (1-t) * 5;
    o += tree(Math.round(x), Math.round(startY + 6 - s*2), Math.round(s), treeC1, treeC2);
    const x2 = 214 + t * 90;
    o += tree(Math.round(x2), Math.round(startY + 6 - s*2), Math.round(s), treeC1, treeC2);
  }
  return o;
}

function collectCard(id){

  t.innerHTML = `<span class="tt">KARTE ERHALTEN · 收录知识卡 ${S.cards.length}/10</span><b>《${c.t}》</b>已存入制度手册`;

   ========================================================= */
let current = 'start';
let SC = null;      /* 当前场景 spec */
let idx = 0;        /* script 指针 */
let typing = false, typeTimer = null, fullText = '';

function drawBG(spec){
  $('#bg').innerHTML = spec.bg();
  const fx = $('#fx');
  fx.className = '';
  if (spec.night) fx.classList.add('night');
  if (spec.rain)  fx.classList.add('rain');
  if (spec.flash) fx.classList.add('flash');
  $('#chlabel').textContent = spec.ch || '';
}

/* 清理舞台上的临时交互层（房间热点 / 立绘 / Zzz / 走路主角） */
function cleanupStage(){
  const hots = document.getElementById('hots');
  if (hots){ hots.style.display = 'none'; hots.innerHTML = ''; }
  ['youover','zzz'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = 'none'; });
  const wk = document.getElementById('walker'); if (wk) wk.style.display = 'none';
}

function go(id){
  current = id;
  SC = SCENES[id]();
  idx = 0;
  closePanel();
  clearFlow();
  clearArm();
  cleanupStage();
  drawBG(SC);
  step();
}

function step(){
  const it = SC.script[idx];
  if (!it) return;
  if (it.t === 'say'){ say(it); return; }
  if (it.t === 'card'){ collectCard(it.id); idx++; step(); return; }
  if (it.t === 'fn'){ it.fn(); hud(); if (checkVitals()) return; idx++; step(); return; }
  if (it.t === 'jump'){ go(it.toFn ? it.toFn() : it.to); return; }
  if (it.t === 'transit'){ transit(it.label, it.to); return; }
  if (it.t === 'panel'){
    if (it.flow){ showFlow(it.title, it.html); idx++; step(); return; }
    showPanel(it.title, it.html, () => { idx++; step(); }, it.after); return;
  }
  if (it.t === 'choice'){ showChoices(it.opts, it.onPick); return; }
  if (it.t === 'multi'){ showMulti(it); return; }
  if (it.t === 'game'){ GAMES[it.kind](it); return; }
}

/* ---- 对白 ---- */
function say(it){
  const w = WHO[it.who];
  $('#choices').innerHTML = '';
  const whoEl = $('#who'), port = $('#portbox');
  if (w && w.n){
    whoEl.textContent = w.n;
    whoEl.className = 'on ' + (w.cls || '');
    port.innerHTML = w.sprite ? SPRITES[w.sprite] : '';
    port.style.visibility = 'visible';
  } else {
    whoEl.className = '';
    port.innerHTML = '';
    port.style.visibility = 'hidden';
  }
  fullText = it.text;
  const txt = $('#text');
  txt.innerHTML = '';
  $('#cont').classList.remove('on');
  typing = true;
  let i = 0;
  const arr = [...fullText];
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    i++;
    txt.textContent = arr.slice(0, i).join('');
    if (i >= arr.length){ finishType(); }
  }, 22);
}
function finishType(){
  clearInterval(typeTimer);
  typing = false;
  $('#text').innerHTML = fullText;   /* 亮 HTML 标记 */
  $('#cont').classList.add('on');
}
$('#text').addEventListener('click', () => advanceClick());
function advanceClick(){
  if (typing){ finishType(); return; }
  const it = SC.script[idx];
  if (it && it.t === 'say'){ idx++; step(); }
}

/* ---- 选项：两段式确认（点一下＝选中，再点＝执行，可撤销） ---- */
let __armBtn = null;
function clearArm(){
  if (__armBtn){ __armBtn.classList.remove('armed'); __armBtn = null; }
  const h = document.getElementById('armhint');
  if (h) h.classList.remove('on');
}
function armConfirm(btn, onConfirm, labelEl){
  if (!btn) return;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (btn.classList.contains('armed')){ clearArm(); onConfirm(); return; }
    clearArm();
    __armBtn = btn;
    btn.classList.add('armed');
    const h = document.getElementById('armhint');
    if (h){
      const lb = (labelEl && labelEl.textContent) || (btn.querySelector('.ol') ? btn.querySelector('.ol').textContent : '');
      h.querySelector('span').textContent = '再点一次【' + String(lb).trim() + '】执行 · 点 ✕ 或其他选项可撤销';
      h.classList.add('on');
    }
  });
}
function showChoices(opts, onPick){
  $('#cont').classList.remove('on');
  clearArm();
  const box = $('#choices');
  box.innerHTML = `<div id="armhint"><span>再点一次执行 · 点 ✕ 撤销</span><button id="armcancel" type="button">✕ 撤销</button></div>` +
    opts.map((o,i) =>
    `<button class="pxopt ${o.primary ? 'primary' : ''}" data-i="${i}" type="button">
       <span class="ol">${o.label}</span>
       ${o.sub ? `<span class="os">${o.sub}</span>` : ''}
     </button>`).join('');
  const cx = document.getElementById('armcancel');
  if (cx) cx.onclick = (e) => { e.stopPropagation(); clearArm(); };
  box.querySelectorAll('.pxopt').forEach(b => {
    armConfirm(b, () => {
      const o = opts[+b.dataset.i];
      o.fn && o.fn();
      hud();
      if (checkVitals()) return;
      onPick && onPick(o);
      clearArm();
      if (!onPick || !onPick.stay){ box.innerHTML = ''; idx++; step(); }
    });
  });
}

/* ---- 多选（危机：选 2 项，同样两段式确认） ---- */
function showMulti(it){
  $('#cont').classList.remove('on');
  clearArm();
  const box = $('#choices');
  const render = () => {
    box.innerHTML = `<div id="armhint"><span>再点一次执行 · 点 ✕ 撤销</span><button id="armcancel" type="button">✕ 撤销</button></div>` +
      it.opts.map((o,i) => {
        const used = S.crisisPicks.includes(o.id);
        const full = S.crisisPicks.length >= 2;
        return `<button class="pxopt ${used ? 'picked' : ''}" data-i="${i}" type="button" ${used || full ? 'disabled' : ''}>
          <span class="ol">${used ? '✓ ' : ''}${o.label}</span>
          <span class="os">${o.sub}</span>
        </button>`;
      }).join('') +
      `<button class="pxopt primary" id="enter" type="button">${it.enterLabel}</button>`;
    const cx = box.querySelector('#armcancel');
    if (cx) cx.onclick = (e) => { e.stopPropagation(); clearArm(); };
    box.querySelectorAll('.pxopt[data-i]').forEach(b => {
      armConfirm(b, () => {
        const o = it.opts[+b.dataset.i];
        o.fn(); S.crisisPicks.push(o.id); hud();
        if (checkVitals()) return;
        render();
      });
    });
    armConfirm(box.querySelector('#enter'), () => {
      box.innerHTML = '';
      it.enter(); hud();
      if (checkVitals()) return;
      idx++; step();
    });
  };
  render();
}

          <li>本科辍学率：德国学生 28%，外国学生 41%；硕士 21% 与 28%。<span class="src">DZHW 估算，至 2022 夏季学期</span></li>
          <li>硕士按时毕业比例：2012 年 39,3% → 2023 年 29,8%；超 1–2 学期 41,8%；超 3 学期以上 28,4%。<span class="src">Destatis，2023 考试年度</span></li>
          <li>约四分之一学生至少多读一年；官方非全日制比例仅 7,6%。<span class="src">CHE 2024</span></li>
          <li>三次尝试规则：一次首考 + 两次补考；论文通常只有 1–2 次机会。<span class="src">各校 Prüfungsordnung</span></li>
          <li>Freiversuch：首次失败不计次数，但限定「标准年限内 + 规定考期 + 指定模块」。<span class="src">Uni des Saarlandes §17(4) 等</span></li>
          <li>「最终不及格」的效力：同专业全德受限，相近专业视各州法律而定。<span class="src">各州高校法</span></li>
          <li>学费：巴登-符腾堡州非欧盟 1.500 €/学期；TUM 2024/25 起本科 2.000–3.000 €、硕士 4.000–6.000 €；其余仅学期费。<span class="src">州高教法、各校收费页，2026-10 核对</span></li>
          <li>长学期学费：下萨克森、萨克森、图林根等约 500 €/学期，起征点为标准年限 +4/+6 学期。<span class="src">各州高校法，2026</span></li>
          <li>DSH：一年 2 次考期；报名要 C1；笔试口试都须通过；DSH-2 ≥ 67%；约 150 €。重考次数由各校自定。<span class="src">dsh.de；Uni Siegen §9</span></li>
          <li>宿舍：约 19,6 万个床位覆盖约 10% 学生；2026-09 约 10,5 万人排队；宿舍约 330 €/月，私人合租约 510 €/月。<span class="src">Deutsches Studierendenwerk（媒体转引）</span></li>
          <li>论文题目：登记后逐字生效；改题须书面申请 + 委员会批准，通常一次、限 4 周内、两位评审签字。<span class="src">HTW Berlin；RWTH Aachen；Uni Duisburg-Essen §21(3)(6)</span></li>
        </ul>
      </details>
      <p style="border:2px solid var(--gold);padding:10px 12px;margin-top:14px;font-size:13px;line-height:1.8">
        <b style="color:var(--gold)">结论句 · 可直接用作汇报收尾：</b><br>
        <b>「毕业难」不是难度问题，是容错结构问题。</b>德国把质量控制压缩进少数不可逆的硬节点，把进度控制摊开成可申请、可购买的软时间；语言、住处、乃至一张填错的表，都被算进这条时间线。真正决定谁被筛掉的，不是智力，而是<b>谁读得懂条款、谁付得起一次重来</b>。
      </p>
      <p style="margin:16px 0 4px"><b style="color:var(--gold)">知识导图 · 德国留学教育体制（汇报主体）</b></p>
      ${mindmapHTML()}
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px">
        <button class="pxbtn gold" onclick="reset()">NOCHMAL · 再走一遍这条路</button>
        <button class="pxbtn" onclick="go('map')">DENKKARTE · 单独查看知识导图</button>
        <button class="pxbtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 回到游戏画面</button>
      </div>` }
  ];
  return { bg: BG.gate, ch: 'AUSWERTUNG', script };
}

/* =========================================================
   启动 / 重置 / 跳转
   ========================================================= */
function reset(){
  Object.assign(S, {
    sem: 1, ects: 0, kraft: 100, geld: 12000, wissen: 0, att: 0,
    prep: 32, log: [], crisisPicks: [], toldMom: false, leave: 0,
    sprache: 0, adresse: 0, extraSem: 0, delay: 0, pings: 0,
    thesisFixed: false, ending: 'A', cards: []
  });
  hud();
  current = 'start';
  SC = SCENES.start();
  idx = 0;
  closePanel();
  clearFlow();
  clearArm();
  cleanupStage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  drawBG(SC);
  $('#start').classList.add('on');
  const whoEl = $('#who'), port = $('#portbox');
  whoEl.textContent = '角色设定 · ROLLE';
  whoEl.className = 'on';
  port.innerHTML = SPRITES.you;
  port.style.visibility = 'visible';
  $('#text').innerHTML = '李晓，22 岁，西安人。机械工程本科一年级。<br>你有 <em>6 个标准学期</em>、一份 24 页的 Prüfungsordnung（考试条例），和一个从不解释的考试办公室。<br>按 <b>START</b>，走进 WS 2025/26 冬季学期。';
  $('#choices').innerHTML = '';
  $('#cont').classList.remove('on');
}

$('#startbtn').addEventListener('click', () => {
  $('#start').classList.remove('on');
  transit('KAP. 1 · SPRACHE', 'sprache');
});

/* 舞台点击也推进对白 */
$('#stage').addEventListener('click', (e) => {
  if ($('#panelwrap').classList.contains('on')) return;
  if ($('#transit').classList.contains('on')) return;
  if ($('#start').classList.contains('on')) return;
  advanceClick();
});

/* 汇报直达：drei-versuche.html?scene=thesis
   可用：start / sprache / mail / wohnung / room / po / exam1 / result1 / crisis /
         dritt / thesis / endA|B|C / debriefA|B|C / gameoverK / gameoverG / map */
const qs = new URLSearchParams(location.search).get('scene');
if (qs === 'start' || !qs){
  reset();
} else if (SCENES[qs]){
  current = qs;
  SC = SCENES[qs]();
  idx = (qs === 'map') ? 1 : 0;   /* 直达导图时跳过对白，直接展开 */
  drawBG(SC);
  step();
} else {
  reset();
}
</script>
